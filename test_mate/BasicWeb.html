<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Algorithm Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="navbar">
        <div class="navbar-brand">
            <a href="#" class="navbar-logo">SortVis</a>
        </div>
        <nav class="navbar-menu">
            <a href="#home" class="navbar-link active">Home</a>
            <a href="#about" class="navbar-link">About</a>
            <a href="#docs" class="navbar-link">Documentation</a>
            <a href="#settings" class="navbar-link">Settings</a>
        </nav>
        <div class="navbar-spacer"></div>
    </div>


    <div class="container">
    
    


        <h1>Sorting Algorithm Visualizer</h1>
        
        <div class="controls">
            <div class="control-group">
                <label for="algorithmSelect">Algorithm:</label>
                <select id="algorithmSelect">
                    <option value="bubble">Bubble Sort</option>
                    <option value="selection">Selection Sort</option>
                    <option value="insertion">Insertion Sort</option>
                    <option value="heap">Heap Sort</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="arraySizeInput">Array Size:</label>
                <input type="number" id="arraySizeInput" value="50" min="10" max="200">
            </div>
            
            <div class="control-group">
                <label for="animationSpeedInput">Speed:</label>
                <input type="range" id="animationSpeedInput" min="10" max="500" value="100">
                <span id="speedValue">100ms</span>
            </div>
            
            <div class="btn-group">
                <button id="startBtn" class="btn-start">Start Sorting</button>
                <button id="resetBtn" class="btn-reset">Reset</button>
                <button id="stopBtn" class="btn-stop">Stop</button>
            </div>
        </div>
        
        <div class="canvas-container">
            <canvas id="arrayCanvas" width="800" height="400"></canvas>
        </div>
        
        <div class="status" id="statusText">Click "Start Sorting" to begin the animation</div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">Comparisons</div>
                <div class="stat-value" id="comparisons">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Swaps</div>
                <div class="stat-value" id="swaps">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Time</div>
                <div class="stat-value" id="time">0ms</div>
            </div>
        </div>
    </div>
    
    <script src="sorting-visualizer.js"></script>
</body>
</html>
